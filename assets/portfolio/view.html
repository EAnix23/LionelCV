<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project screenshot</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0a08; }
  body { display: flex; align-items: center; justify-content: center; }
  img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <img id="shot" alt="Project screenshot">
  <script>
    // Only load images that live next to this page (e.g. ?img=sms-platform.webp)
    const name = new URLSearchParams(location.search).get('img') || '';
    if (/^[a-z0-9-]+\.webp$/.test(name)) document.getElementById('shot').src = name;
  </script>
</body>
</html>
